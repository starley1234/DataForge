version: "3.8"

services:
  app:
    build: .
    container_name: b2b_enrichment_engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres_pass@db:5432/leads_b2b
      - DADATA_API_KEY=${DADATA_API_KEY:-}
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - HOST=0.0.0.0
      - PORT=8080
      - LOG_LEVEL=INFO
      - BATCH_CONCURRENCY=4
      - ENABLE_METRICS=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - leads_data:/app/data

  db:
    image: postgres:16-alpine
    container_name: b2b_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_pass
      - POSTGRES_DB=leads_b2b
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leads_b2b"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  leads_data:
  pg_data:
